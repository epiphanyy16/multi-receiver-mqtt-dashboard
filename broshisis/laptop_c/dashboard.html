<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE Receiver Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            background: #111111;
            color: #eeeeee;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff6600;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.3rem;
            color: #ff6600;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a1a1a;
            border: 1px solid #2e2e2e;
            padding: 12px 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: #888888;
        }

        input[type="text"] {
            background: #0d0d0d;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-family: inherit;
            width: 140px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ff6600;
        }

        button {
            background: #ff6600;
            color: #000000;
            font-weight: 600;
            border: none;
            padding: 7px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover {
            background: #ff7f2a;
        }

        button.btn-secondary {
            background: #2a2a2a;
            color: #dddddd;
            font-weight: normal;
            border: 1px solid #444444;
        }

        button.btn-secondary:hover {
            background: #333333;
            color: #ffffff;
        }

        button.btn-active {
            background: #cc5200;
            color: #ffffff;
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            font-size: 0.85rem;
        }

        .status-light {
            width: 10px;
            height: 10px;
            background: #444444;
            display: inline-block;
        }

        .status-light.connected {
            background: #ff6600;
        }

        .status-light.error {
            background: #d32f2f;
        }

        .status-text {
            color: #aaaaaa;
        }

        /* Receiver cards layout */
        .receivers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .receiver-card {
            background: #181818;
            border: 1px solid #2c2c2c;
            border-top: 3px solid #ff6600;
            display: flex;
            flex-direction: column;
            height: 380px;
        }

        .receiver-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #202020;
            border-bottom: 1px solid #2a2a2a;
        }

        .receiver-name {
            font-weight: 600;
            color: #ff6600;
            font-size: 0.95rem;
        }

        .receiver-topic {
            font-size: 0.75rem;
            color: #666666;
            font-family: monospace;
        }

        .receiver-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: #141414;
            border-bottom: 1px solid #262626;
            padding: 8px 12px;
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #777777;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            font-family: monospace;
        }

        .receiver-log {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            font-family: monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            background: #111111;
        }

        .log-row {
            padding: 4px 0;
            border-bottom: 1px solid #1c1c1c;
            display: flex;
            gap: 8px;
        }

        .log-row .time {
            color: #666666;
            min-width: 65px;
        }

        .log-row .rssi {
            color: #ff6600;
            min-width: 65px;
        }

        .log-row .count {
            color: #dddddd;
            min-width: 55px;
        }

        .log-empty {
            color: #444444;
            padding: 20px 0;
            text-align: center;
            font-style: italic;
        }

        /* System log footer */
        .system-section {
            background: #161616;
            border: 1px solid #262626;
            padding: 10px 14px;
        }

        .system-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .system-header h2 {
            font-size: 0.8rem;
            color: #777777;
            text-transform: uppercase;
            font-weight: 600;
        }

        .system-log {
            max-height: 100px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            color: #888888;
            line-height: 1.4;
        }

        .system-log div {
            padding: 2px 0;
        }

        .system-log .err {
            color: #ff5555;
        }
    </style>
</head>
<body>

    <header>
        <h1>BLE EMERGENCY SWITCH DASHBOARD</h1>
        <div class="status-box">
            <span class="status-light" id="statusLight"></span>
            <span class="status-text" id="statusText">Disconnected</span>
        </div>
    </header>

    <div class="controls">
        <div class="control-group">
            <label for="brokerIp">Broker IP:</label>
            <input type="text" id="brokerIp" placeholder="172.20.10.4">
        </div>
        <div class="control-group">
            <label for="brokerPort">Port:</label>
            <input type="text" id="brokerPort" value="9001" style="width: 65px;">
        </div>
        <div class="control-group">
            <label for="topicFilter">Topic:</label>
            <input type="text" id="topicFilter" value="BLEReceiver/+" style="width: 130px;">
        </div>

        <button id="connectBtn" onclick="toggleConnect()">Connect</button>
        <button class="btn-secondary" onclick="clearAllData()">Clear Logs</button>
    </div>

    <!-- Receiver cards container -->
    <div class="receivers-grid" id="receiversGrid">
        <!-- Receiver cards are populated dynamically or by default -->
    </div>

    <!-- System & Connection Log -->
    <div class="system-section">
        <div class="system-header">
            <h2>System Events</h2>
        </div>
        <div class="system-log" id="systemLog">
            <div>[System] Dashboard ready. Enter broker IP and click Connect.</div>
        </div>
    </div>

    <script src="mqtt.min.js"></script>
    <script>
        let client = null;
        let isConnecting = false;

        // Known default receivers
        const receivers = {};
        const defaultReceivers = ["001", "002", "003"];

        const statusLight = document.getElementById("statusLight");
        const statusText = document.getElementById("statusText");
        const connectBtn = document.getElementById("connectBtn");
        const systemLog = document.getElementById("systemLog");
        const receiversGrid = document.getElementById("receiversGrid");

        // Set up the default receiver sections right away
        defaultReceivers.forEach(id => getOrCreateReceiverCard(id));

        function logSystem(msg, isErr = false) {
            const time = new Date().toLocaleTimeString("en-GB", { hour12: false });
            const row = document.createElement("div");
            if (isErr) row.className = "err";
            row.textContent = `[${time}] ${msg}`;
            systemLog.appendChild(row);
            systemLog.scrollTop = systemLog.scrollHeight;
        }

        function setStatus(connected, text, isErr = false) {
            statusLight.className = "status-light" + (connected ? " connected" : (isErr ? " error" : ""));
            statusText.textContent = text;
            connectBtn.textContent = connected ? "Disconnect" : "Connect";
        }

        function getOrCreateReceiverCard(receiverId) {
            if (receivers[receiverId]) {
                return receivers[receiverId];
            }

            const card = document.createElement("div");
            card.className = "receiver-card";
            card.id = `card-${receiverId}`;
            card.innerHTML = `
                <div class="receiver-header">
                    <span class="receiver-name">Receiver ${receiverId}</span>
                    <span class="receiver-topic">BLEReceiver/${receiverId}</span>
                </div>
                <div class="receiver-stats">
                    <div class="stat-item">
                        <span class="stat-label">Packets</span>
                        <span class="stat-value" id="count-${receiverId}">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">RSSI</span>
                        <span class="stat-value" id="rssi-${receiverId}">--</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Last Seen</span>
                        <span class="stat-value" id="time-${receiverId}">--</span>
                    </div>
                </div>
                <div class="receiver-log" id="log-${receiverId}">
                    <div class="log-empty">No publishes received yet</div>
                </div>
            `;

            receiversGrid.appendChild(card);

            receivers[receiverId] = {
                packetCount: 0,
                lastPacketNum: null,
                lastRssi: null,
                lastTimestamp: 0,
                countEl: card.querySelector(`#count-${receiverId}`),
                rssiEl: card.querySelector(`#rssi-${receiverId}`),
                timeEl: card.querySelector(`#time-${receiverId}`),
                logEl: card.querySelector(`#log-${receiverId}`)
            };

            return receivers[receiverId];
        }

        // Deduplication and message processing
        function handleIncomingMessage(topic, payloadStr) {
            let data;
            try {
                data = JSON.parse(payloadStr);
            } catch (e) {
                logSystem(`Failed to parse payload on ${topic}: ${payloadStr}`, true);
                return;
            }

            // Extract receiver id from payload or topic suffix
            let receiverId = data.receiver_id;
            if (!receiverId && topic.includes("/")) {
                receiverId = topic.split("/")[1];
            }
            if (!receiverId) {
                receiverId = "unknown";
            }

            const rec = getOrCreateReceiverCard(receiverId);
            const now = Date.now();
            const timeStr = new Date().toLocaleTimeString("en-GB", { hour12: false });

            const rssi = data.rssi !== undefined ? data.rssi : "--";
            const pktNum = data.packet_count !== undefined ? data.packet_count : "--";

            // Root-cause fix for duplicate rendering:
            // Check if this identical packet was already processed for this receiver in the last 200ms
            if (rec.lastPacketNum !== null && rec.lastPacketNum === pktNum && (now - rec.lastTimestamp) < 300) {
                return;
            }

            rec.lastPacketNum = pktNum;
            rec.lastTimestamp = now;
            rec.packetCount++;

            // Update header stats
            rec.countEl.textContent = rec.packetCount;
            rec.rssiEl.textContent = rssi !== "--" ? `${rssi} dBm` : "--";
            rec.timeEl.textContent = timeStr;

            // Remove placeholder if present
            const emptyPlaceholder = rec.logEl.querySelector(".log-empty");
            if (emptyPlaceholder) {
                emptyPlaceholder.remove();
            }

            // Append row
            const row = document.createElement("div");
            row.className = "log-row";
            row.innerHTML = `
                <span class="time">${timeStr}</span>
                <span class="rssi">${rssi} dBm</span>
                <span class="count">#${pktNum}</span>
            `;

            rec.logEl.appendChild(row);
            rec.logEl.scrollTop = rec.logEl.scrollHeight;

            // Cap entries to keep memory low
            while (rec.logEl.children.length > 50) {
                rec.logEl.removeChild(rec.logEl.firstChild);
            }
        }

        // MQTT Connection
        function toggleConnect() {
            // If already connected or connecting, disconnect cleanly
            if (client) {
                cleanupClient();
                setStatus(false, "Disconnected");
                logSystem("Disconnected from broker.");
                return;
            }

            if (typeof mqtt === "undefined") {
                logSystem("mqtt.min.js is not loaded. Cannot connect.", true);
                return;
            }

            const host = document.getElementById("brokerIp").value.trim();
            const port = document.getElementById("brokerPort").value.trim() || "9001";
            const topic = document.getElementById("topicFilter").value.trim() || "BLEReceiver/+";

            if (!host) {
                alert("Please enter a Broker IP address");
                return;
            }

            const wsUrl = `ws://${host}:${port}`;
            logSystem(`Connecting to ${wsUrl}...`);
            setStatus(false, "Connecting...");
            isConnecting = true;

            const clientId = `Dash_${Math.random().toString(16).substring(2, 8)}`;

            try {
                client = mqtt.connect(wsUrl, {
                    clientId: clientId,
                    clean: true,
                    connectTimeout: 5000,
                    reconnectPeriod: 5000
                });
            } catch (err) {
                logSystem(`Connection error: ${err.message}`, true);
                cleanupClient();
                setStatus(false, "Error", true);
                return;
            }

            client.on("connect", () => {
                isConnecting = false;
                setStatus(true, "Connected");
                logSystem(`Connected to broker as ${clientId}`);

                client.subscribe(topic, (err) => {
                    if (err) {
                        logSystem(`Failed to subscribe to ${topic}: ${err.message}`, true);
                    } else {
                        logSystem(`Subscribed to ${topic}`);
                    }
                });
            });

            client.on("message", (msgTopic, message) => {
                handleIncomingMessage(msgTopic, message.toString());
            });

            client.on("error", (err) => {
                logSystem(`MQTT Error: ${err.message}`, true);
            });

            client.on("close", () => {
                if (!isConnecting && client) {
                    setStatus(false, "Disconnected");
                }
            });
        }

        function cleanupClient() {
            if (client) {
                try {
                    client.removeAllListeners();
                    client.end(true);
                } catch (e) {}
                client = null;
            }
            isConnecting = false;
        }


        // Clear all log entries
        function clearAllData() {
            Object.keys(receivers).forEach(id => {
                const rec = receivers[id];
                rec.packetCount = 0;
                rec.lastPacketNum = null;
                rec.lastTimestamp = 0;
                rec.countEl.textContent = "0";
                rec.rssiEl.textContent = "--";
                rec.timeEl.textContent = "--";
                rec.logEl.innerHTML = '<div class="log-empty">No publishes received yet</div>';
            });
            systemLog.innerHTML = "";
            logSystem("Logs cleared.");
        }
    </script>
</body>
</html>
