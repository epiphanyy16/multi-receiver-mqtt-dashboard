services:
  dashboard:
    build: .
    container_name: ble-dashboard
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: BLEReceiver/+
      EVENT_HISTORY_SIZE: ${EVENT_HISTORY_SIZE:-20000}
    ports:
      - "5000:5000"
